<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LVMIUNION · 客户服务</title>
<style>
  :root{--ink:#1c2b26;--muted:#6b7a74;--brand:#1f3d33;--bg:#f6f4ef}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:520px;margin:0 auto;padding:48px 20px}
  .logo{width:44px;height:44px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;margin-bottom:20px}
  h1{font-size:24px;margin:0 0 8px}
  p{color:var(--muted);margin:0 0 18px}
  .card{background:#fff;border:1px solid #e6e2d9;border-radius:14px;padding:18px;margin-top:18px}
  code{background:#f2efe8;padding:2px 6px;border-radius:6px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">L</div>
  <h1>LVMIUNION · 客户服务</h1>
  <p>这里是为每位客户单独生成的服务卡页面。请使用我们发给您的专属链接打开。</p>
  <div class="card">
    <p style="margin:0">找不到链接？直接联系 <strong>智能杨工</strong>，我重新发您。</p>
  </div>
</div>
</body>
</html>
