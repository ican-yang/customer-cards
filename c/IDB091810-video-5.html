<html lang="zh-CN"><head><meta charset="utf-8">

<title>场景控制效果（离家模式）</title>
<style>
  :root{--ink:#1c2b26;--muted:#6b7a74;--line:#e6e2d9;--bg:#f6f4ef;--brand:#1f3d33;--gold:#b08d57;--ok:#2f7d5b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 40px}
  .wrap{max-width:480px;margin:0 auto}
  .brandrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
  .back{font-size:13px;color:var(--brand);text-decoration:none;border:1px solid #dcebe2;background:#f2f7f4;
    padding:5px 12px;border-radius:999px;white-space:nowrap}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;
    box-shadow:0 1px 2px rgba(28,43,38,.04),0 8px 24px rgba(28,43,38,.05)}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px}
  h2{font-size:14px;margin:0 0 10px;letter-spacing:.06em;color:var(--brand)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:14px;line-height:1.2;padding:9px 13px;border:1px solid #e6e2d9;background:#fff;
    border-radius:999px;color:var(--ink)}
  .chip small{color:var(--muted);font-size:11px;margin-left:4px}
  .vwrap{margin-top:12px;display:grid;gap:10px}
  .vcard{display:block;border:1px solid #eceae2;border-radius:12px;overflow:hidden;background:#fbfaf6;text-decoration:none;color:inherit}
  .thumb{position:relative;width:100%;aspect-ratio:16/9;background:#e9e5da center/cover no-repeat}
  .thumb .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.52);color:#fff;
    display:grid;place-items:center;font-size:20px;padding-left:4px}
  .vmeta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px}
  .vt{font-size:13.5px;font-weight:600}
  .like{border:1px solid #e6e2d9;background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;
    color:var(--muted);cursor:pointer;white-space:nowrap}
  .like.on{background:#fdf2ec;border-color:#f0d8ca;color:#b3683a}
  .tip{background:linear-gradient(180deg,#f2f7f4,#eaf2ed);border:1px solid #dcebe2;border-radius:12px;
    padding:12px 14px;font-size:13px;color:#2c4a40;line-height:1.7}
  .tip b{color:var(--brand)}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:16px;line-height:1.8}
  .mask{position:fixed;inset:0;background:rgba(16,22,19,.82);display:none;z-index:99;align-items:center;justify-content:center;padding:16px}
  .mask.on{display:flex}
  .vbox{width:100%;max-width:520px;position:relative}
  .xclose{position:absolute;right:6px;top:6px;width:34px;height:34px;border:0;border-radius:50%;
    background:rgba(0,0,0,.55);color:#fff;font-size:16px;line-height:1;display:grid;place-items:center;z-index:2}
  .vrail{position:absolute;right:10px;bottom:104px;display:flex;flex-direction:column;gap:18px;align-items:center;z-index:3}
  .rail{background:transparent;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;
    text-align:center;padding:0}
  .rail .ico{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.4);display:grid;place-items:center;
    font-size:21px;line-height:1;backdrop-filter:blur(2px)}
  .rail .num{font-size:11px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .rail.on .ico{background:rgba(214,88,52,.85)}
  .vbox video{width:100%;border-radius:12px;background:#000;display:block}
  .vbox .vtt{color:#fff;font-size:13px;margin:8px 2px 0}
  .vbox .vclose{display:block;width:100%;margin-top:10px;border:0;border-radius:10px;padding:11px;
    background:#fff;color:#1c2b26;font-size:15px}
</style></head>
